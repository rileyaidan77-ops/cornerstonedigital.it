<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Contact Us | Cornerstone Digital</title>
    
    <!-- Google Fonts: Fraunces -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    
    <style>
        .click-effect {
            transition: transform 0.15s ease, background-color 0.2s ease;
        }
        .click-effect:active {
            transform: scale(0.97) translateY(2px);
        }
    </style>
</head>
<body style="margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #2E332D; background-color: #F4EFE6; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between;">

    <!-- TOP NAVIGATION BAR -->
    <nav style="background-color: #33402F; padding: 15px 20px; text-align: center; border-bottom: 1px solid #4A5A48; position: sticky; top: 0; z-index: 100;">
        <div style="max-width: 1000px; margin: 0 auto; display: flex; justify-content: center; gap: 25px; flex-wrap: wrap;">
            <a href="index.html" class="click-effect" style="color: #F4EFE6; text-decoration: none; font-weight: bold; font-size: 0.95rem;">Welcome Hub</a>
            <a href="hero.html" class="click-effect" style="color: #F4EFE6; text-decoration: none; font-weight: bold; font-size: 0.95rem;">Hero</a>
            <a href="about.html" class="click-effect" style="color: #F4EFE6; text-decoration: none; font-weight: bold; font-size: 0.95rem;">About</a>
            <a href="pricing.html" class="click-effect" style="color: #F4EFE6; text-decoration: none; font-weight: bold; font-size: 0.95rem;">Pricing</a>
            <a href="contact.html" class="click-effect" style="color: #B9C2B3; text-decoration: none; font-weight: bold; font-size: 0.95rem;">Contact Us</a>
        </div>
    </nav>

    <!-- CONTACT FORM SECTION -->
    <main style="padding: 80px 20px; background-color: #2E332D; color: #B9C2B3; display: flex; align-items: center; justify-content: center; flex: 1;">
        <div style="max-width: 600px; width: 100%; text-align: center;">
            
            <h1 style="font-family: 'Fraunces', serif; font-size: 2.8rem; color: #F4EFE6; margin-bottom: 10px;">Get in Touch</h1>
            <p style="margin-bottom: 35px; color: #B9C2B3; font-size: 1.1rem;">Ready to scale your business? Fill out the form below and we’ll respond within 24 hours.</p>
            
            <!-- Contact Form (Formspree) -->
            <form action="https://formspree.io/f/xppdzjyp" method="POST" style="display: flex; flex-direction: column; gap: 18px; text-align: left; background-color: #33402F; padding: 40px; border-radius: 12px; border: 1px solid #4A5A48; box-shadow: 0 8px 24px rgba(0,0,0,0.2);">
                
                <div>
                    <label for="name" style="display: block; font-size: 0.9rem; color: #F4EFE6; margin-bottom: 6px; font-weight: 600;">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #4A5A48; background-color: #2E332D; color: #F4EFE6; box-sizing: border-box;">
                </div>

                <div>
                    <label for="email" style="display: block; font-size: 0.9rem; color: #F4EFE6; margin-bottom: 6px; font-weight: 600;">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #4A5A48; background-color: #2E332D; color: #F4EFE6; box-sizing: border-box;">
                </div>

                <div>
                    <label for="message" style="display: block; font-size: 0.9rem; color: #F4EFE6; margin-bottom: 6px; font-weight: 600;">Project Details / Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Tell us about your business and goals..." style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #4A5A48; background-color: #2E332D; color: #F4EFE6; box-sizing: border-box; resize: vertical;"></textarea>
                </div>

                <button type="submit" class="click-effect" style="background-color: #C58B66; color: #ffffff; padding: 14px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer;">Send Message</button>
            </form>

        </div>
    </main>

    <!-- FOOTER -->
    <footer style="padding: 30px 20px; background-color: #242823; color: #6F7A6C; text-align: center;">
        <p style="font-size: 0.9rem; margin: 0;">&copy; 2026 Cornerstone Digital. All rights reserved.</p>
    </footer>

</body>
</html>
